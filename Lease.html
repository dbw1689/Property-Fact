<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property & Lease Management Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1150px; margin: 0 auto; }
        h2 { text-align: center; color: #2c3e50; }

        /* Form styling */
        .form-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; }
        input:focus { border-color: #3498db; outline: none; }
        
        /* Buttons */
        .button-group { display: flex; gap: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; font-size: 0.95em; cursor: pointer; transition: background 0.2s; }
        .btn-save { background-color: #2ecc71; color: white; }
        .btn-save:hover { background-color: #27ae60; }
        .btn-clear { background-color: #95a5a6; color: white; }
        .btn-clear:hover { background-color: #7f8c8d; }
        
        .actions-cell { display: flex; gap: 5px; }
        .btn-edit { background-color: #3498db; color: white; padding: 5px 10px; font-size: 0.85em; }
        .btn-edit:hover { background-color: #2980b9; }
        .btn-renew { background-color: #f39c12; color: white; padding: 5px 10px; font-size: 0.85em; }
        .btn-renew:hover { background-color: #d35400; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 0.85em; }
        .btn-delete:hover { background-color: #c0392b; }

        /* Tables */
        .table-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: 600; color: #555; cursor: pointer; }
        th:hover { background-color: #e9ecef; }
        tbody tr:hover { background-color: #f1f4f6; }
        .expired-row { background-color: #fae1df !important; opacity: 0.85; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lease & Property Manager</h2>

    <!-- Add/Edit Form -->
    <div class="form-card">
        <h3 id="form-title">Add New Lease</h3>
        <form id="lease-form">
            <input type="hidden" id="edit-index">
            <div class="form-grid">
                <div class="form-group">
                    <label for="property">Property Name/Address</label>
                    <input type="text" id="property" required>
                </div>
                <div class="form-group">
                    <label for="tenant">Tenant Name</label>
                    <input type="text" id="tenant" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="telephone">Telephone</label>
                    <input type="tel" id="telephone" required>
                </div>
                <div class="form-group">
                    <label for="start">Lease Start</label>
                    <input type="date" id="start" required>
                </div>
                <div class="form-group">
                    <label for="end">Lease End (Can override)</label>
                    <input type="date" id="end" required>
                </div>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-save" id="save-btn">Save Lease</button>
                <button type="button" class="btn-clear" onclick="clearForm()">Clear Fields</button>
            </div>
        </form>
    </div>

    <!-- Active Leases Table -->
    <div class="table-card">
        <h3>Active Leases</h3>
        <table>
            <thead>
                <tr>
                    <th onclick="sortActiveTable('property')">Property</th>
                    <th onclick="sortActiveTable('tenant')">Tenant</th>
                    <th onclick="sortActiveTable('email')">Email</th>
                    <th onclick="sortActiveTable('telephone')">Telephone</th>
                    <th onclick="sortActiveTable('start')">Lease Start</th>
                    <th onclick="sortActiveTable('end')">Lease End</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="active-leases-body">
                <!-- Active leases will populate here -->
            </tbody>
        </table>
    </div>

    <!-- Expired Leases Table -->
    <div class="table-card">
        <h3>Expired Leases</h3>
        <table>
            <thead>
                <tr>
                    <th onclick="sortExpiredTable('property')">Property</th>
                    <th onclick="sortExpiredTable('tenant')">Tenant</th>
                    <th onclick="sortExpiredTable('email')">Email</th>
                    <th onclick="sortExpiredTable('telephone')">Telephone</th>
                    <th onclick="sortExpiredTable('start')">Lease Start</th>
                    <th onclick="sortExpiredTable('end')">Lease End</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expired-leases-body" class="expired-tbody">
                <!-- Expired leases will populate here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Local memory state
    let leases = [];

    // Sorting state
    let activeSortCol = 'property';
    let activeSortAsc = true;
    let expiredSortCol = 'property';
    let expiredSortAsc = true;

    // Initialize UI listeners
    document.addEventListener("DOMContentLoaded", () => {
        renderTables();

        // Automated default generation (Still allows user text override)
        document.getElementById('start').addEventListener('change', function() {
            if (this.value) {
                document.getElementById('end').value = calculateOneYearLater(this.value);
            }
        });

        // Event interception for save mechanics
        document.getElementById('lease-form').addEventListener('submit', (e) => {
            e.preventDefault();
            saveLease();
        });
    });

    // Date computation offset framework
    function calculateOneYearLater(startDateString) {
        let startDate = new Date(startDateString + 'T00:00:00');
        startDate.setFullYear(startDate.getFullYear() + 1);
        let year = startDate.getFullYear();
        let month = String(startDate.getMonth() + 1).padStart(2, '0');
        let day = String(startDate.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // Process submission array push/alterations
    function saveLease() {
        const editIndex = document.getElementById('edit-index').value;
        const leaseData = {
            property: document.getElementById('property').value,
            tenant: document.getElementById('tenant').value,
            email: document.getElementById('email').value,
            telephone: document.getElementById('telephone').value,
            start: document.getElementById('start').value,
            end: document.getElementById('end').value
        };

        if (editIndex === "") {
            leases.push(leaseData);
        } else {
            leases[editIndex] = leaseData;
        }

        clearForm();
        renderTables();
    }

    // Populate data back up into structural inputs
    function editLease(index) {
        const lease = leases[index];
        document.getElementById('edit-index').value = index;
        document.getElementById('property').value = lease.property;
        document.getElementById('tenant').value = lease.tenant;
        document.getElementById('email').value = lease.email;
        document.getElementById('telephone').value = lease.telephone;
        document.getElementById('start').value = lease.start;
        document.getElementById('end').value = lease.end;

        document.getElementById('form-title').innerText = "Edit Lease";
        document.getElementById('save-btn').innerText = "Update Lease";
    }

    // Automation step to shift date range forward safely
    function renewLease(index) {
        const lease = leases[index];
        const newStart = lease.end;
        const newEnd = calculateOneYearLater(newStart);
        
        leases[index].start = newStart;
        leases[index].end = newEnd;
        
        renderTables();
    }

    // Delete item completely from master storage array
    function deleteLease(index) {
        if (confirm("Are you sure you want to permanently delete this lease record?")) {
            leases.splice(index, 1);
            clearForm();
            renderTables();
        }
    }

    // Form resetting utilities
    function clearForm() {
        document.getElementById('lease-form').reset();
        document.getElementById('edit-index').value = "";
        document.getElementById('form-title').innerText = "Add New Lease";
        document.getElementById('save-btn').innerText = "Save Lease";
    }

    // Dynamic processing and view updating engine
    function renderTables() {
        const today = new Date().toISOString().split('T')[0];
        
        let activeLeases = leases.filter(l => l.end >= today);
        let expiredLeases = leases.filter(l => l.end < today);

        // Alpha sorting logic: Active entries
        activeLeases.sort((a, b) => {
            let valA = a[activeSortCol].toLowerCase();
            let valB = b[activeSortCol].toLowerCase();
            if(valA < valB) return activeSortAsc ? -1 : 1;
            if(valA > valB) return activeSortAsc ? 1 : -1;
            return 0;
        });

        // Alpha sorting logic: Expired entries (Stays locked on Property)
        expiredLeases.sort((a, b) => {
            let valA = a[expiredSortCol].toLowerCase();
            let valB = b[expiredSortCol].toLowerCase();
            if (valA < valB) return expiredSortAsc ? -1 : 1;
            if (valA > valB) return expiredSortAsc ? 1 : -1;
            return 0;
        });

        // HTML generation structural output target loops
        const activeTbody = document.getElementById('active-leases-body');
        activeTbody.innerHTML = '';
        activeLeases.forEach((lease) => {
            let origIndex = leases.findIndex(l => l === lease);
            activeTbody.innerHTML += `
                <tr>
                    <td>${lease.property}</td>
                    <td>${lease.tenant}</td>
                    <td>${lease.email}</td>
                    <td>${lease.telephone}</td>
                    <td>${lease.start}</td>
                    <td>${lease.end}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn-edit" onclick="editLease(${origIndex})">Edit</button>
                            <button class="btn-renew" onclick="renewLease(${origIndex})">Renew</button>
                            <button class="btn-delete" onclick="deleteLease(${origIndex})">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        const expiredTbody = document.getElementById('expired-leases-body');
        expiredTbody.innerHTML = '';
        expiredLeases.forEach(lease => {
            let origIndex = leases.findIndex(l => l === lease);
            expiredTbody.innerHTML += `
                <tr class="expired-row">
                    <td>${lease.property}</td>
                    <td>${lease.tenant}</td>
                    <td>${lease.email}</td>
                    <td>${lease.telephone}</td>
                    <td>${lease.start}</td>
                    <td>${lease.end}</td>
                    <td>
                        
                    </td>
                </tr>
            `;
        });
    }

    // Header interactive sorting switches
    function sortActiveTable(col) {
        if (activeSortCol === col) {
            activeSortAsc = !activeSortAsc;
        } else {
            activeSortCol = col;
            activeSortAsc = true;
        }
        renderTables();
    }

    function sortExpiredTable(col) {
        if (expiredSortCol === col) {
            expiredSortAsc = !expiredSortAsc;
        } else {
            expiredSortCol = col;
            expiredSortAsc = true;
        }
        renderTables();
    }
</script>

</body>
</html>
