<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Management System</title>
    
    <!-- Using unpkg exactly as requested -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #111;
            margin-bottom: 20px;
        }
        .panel {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .debug-console {
            background-color: #fcedec;
            border: 1px solid #f5c2c2;
            color: #a81c1c;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 13px;
        }
        .debug-console.success {
            background-color: #edf7ed;
            border: 1px solid #c3e6cb;
            color: #1e4620;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .actions {
            text-align: right;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-save { background-color: #0056b3; color: white; }
        .btn-cancel { background-color: #6c757d; color: white; margin-right: 8px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #444;
            font-weight: bold;
        }
        .active-hdr { color: #28a745; border-bottom: 2px solid #28a745; }
        .expired-hdr { color: #dc3545; border-bottom: 2px solid #dc3545; }
        
        .link-btn {
            background: none;
            border: none;
            padding: 0;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-right: 10px;
        }
        .lnk-renew { color: #28a745; }
        .lnk-edit { color: #0056b3; }
        .lnk-delete { color: #dc3545; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lease Management Dashboard</h1>

        <!-- System Log Status Window -->
        <div id="debug-log" class="debug-console">Connecting to your database application...</div>

        <!-- Input Panel -->
        <div class="panel">
            <h2 id="form-title" style="margin-top:0; font-size:18px;">Add New Lease</h2>
            <form id="lease-form">
                <input type="hidden" id="lease-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Property</label>
                        <input type="text" id="property" required>
                    </div>
                    <div class="form-group">
                        <label>Tenant Name</label>
                        <input type="text" id="tenant" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Telephone</label>
                        <input type="tel" id="telephone" required>
                    </div>
                    <div class="form-group">
                        <label>Lease Start</label>
                        <input type="date" id="lease-start" required>
                    </div>
                    <div class="form-group">
                        <label>Lease End</label>
                        <input type="date" id="lease-end" required>
                    </div>
                </div>
                <div class="actions">
                    <button type="button" id="cancel-btn" class="btn-cancel hidden">Cancel</button>
                    <button type="submit" class="btn-save">Save Lease</button>
                </div>
            </form>
        </div>

        <!-- Active Grid -->
        <div class="panel">
            <h2 class="active-hdr" style="margin-top:0; font-size:18px; padding-bottom:6px;">Active Leases</h2>
            <table>
                <thead>
                    <tr>
                        <th>Property</th>
                        <th>Tenant</th>
                        <th>Email</th>
                        <th>Telephone</th>
                        <th>Lease Start</th>
                        <th>Lease End</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="active-list"></tbody>
            </table>
        </div>

        <!-- Expired Grid (Read-Only Layout) -->
        <div class="panel">
            <h2 class="expired-hdr" style="margin-top:0; font-size:18px; padding-bottom:6px;">Expired Leases Archive</h2>
            <table>
                <thead>
                    <tr>
                        <th>Property</th>
                        <th>Tenant</th>
                        <th>Email</th>
                        <th>Telephone</th>
                        <th>Lease Start</th>
                        <th>Lease End</th>
                    </tr>
                </thead>
                <tbody id="expired-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://rcardcimqinnukytxrly.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_b1czOslbmsyywK8BrBe5KQ_EBKQREfm"; 

        const debugLog = document.getElementById('debug-log');
        let supabaseClient;
        let leaseRecordsCache = [];

        // Safe setup checking for global library parameters
        try {
            if (typeof window.supabase === 'undefined') {
                throw new Error("Supabase library script failed to download.");
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            setSystemStatus("Connected. Reading records...", true);
        } catch (initErr) {
            setSystemStatus("Engine Launch Aborted: " + initErr.message, false);
        }

        const form = document.getElementById('lease-form');
        const activeList = document.getElementById('active-list');
        const expiredList = document.getElementById('expired-list');
        const cancelBtn = document.getElementById('cancel-btn');

        form.addEventListener('submit', saveLease);
        cancelBtn.addEventListener('click', resetForm);

	// Auto-set Lease End to exactly 1 year from Lease Start
	document.getElementById('lease-start').addEventListener('input', (e) => {
    if (!e.target.value) return;
    const startDate = new Date(e.target.value);
    startDate.setFullYear(startDate.getFullYear() + 1);
    document.getElementById('lease-end').value = startDate.toISOString().split('T')[0];
});

        
        if (supabaseClient) {
            fetchLeases();
        }

        function setSystemStatus(text, isSuccess) {
            debugLog.innerText = text;
            if(isSuccess) {
                debugLog.className = "debug-console success";
            } else {
                debugLog.className = "debug-console";
            }
        }

        async function fetchLeases() {
            try {
                const { data: leases, error } = await supabaseClient
                    .from('leases')
                    .select('*')
                    .order('lease_end', { ascending: true });

                if (error) throw error;

                leaseRecordsCache = leases || [];
                activeList.innerHTML = '';
                expiredList.innerHTML = '';
                const today = new Date().toISOString().split('T')[0];

                leaseRecordsCache.forEach(lease => {
                    const isExpired = lease.lease_end < today;
                    const row = document.createElement('tr');
                    
                    // Bulletproof Native DOM Node Text Assignments to avoid breaking strings
                    const tdProp = document.createElement('td');
                    const strongProp = document.createElement('strong');
                    strongProp.innerText = lease.property || '';
                    tdProp.appendChild(strongProp);

                    const tdTenant = document.createElement('td');
                    tdTenant.innerText = lease.tenant || '';

                    const tdEmail = document.createElement('td');
                    tdEmail.innerText = lease.email || '';

                    const tdTel = document.createElement('td');
                    tdTel.innerText = lease.telephone || '';

                    const tdStart = document.createElement('td');
                    tdStart.innerText = lease.lease_start || '';

                    const tdEnd = document.createElement('td');
                    tdEnd.innerText = lease.lease_end || '';

                    row.appendChild(tdProp);
                    row.appendChild(tdTenant);
                    row.appendChild(tdEmail);
                    row.appendChild(tdTel);
                    row.appendChild(tdStart);
                    row.appendChild(tdEnd);

                    if (isExpired) {
                        // Expired table rendering (strictly read-only)
                        expiredList.appendChild(row);
                    } else {
                        // Active table rendering with action buttons linked safely by ID lookup
                        const tdActions = document.createElement('td');
                        
                        const btnRenew = document.createElement('button');
                        btnRenew.className = "link-btn lnk-renew";
                        btnRenew.innerText = "Renew";
                        btnRenew.onclick = () => window.renewLease(lease.id);

                        const btnEdit = document.createElement('button');
                        btnEdit.className = "link-btn lnk-edit";
                        btnEdit.innerText = "Edit";
                        btnEdit.onclick = () => window.editLease(lease.id);

                        const btnDelete = document.createElement('button');
                        btnDelete.className = "link-btn lnk-delete";
                        btnDelete.innerText = "Delete";
                        btnDelete.onclick = () => window.deleteLease(lease.id);

                        tdActions.appendChild(btnRenew);
                        tdActions.appendChild(btnEdit);
                        tdActions.appendChild(btnDelete);
                        row.appendChild(tdActions);
                        
                        activeList.appendChild(row);
                    }
                });
                
                setSystemStatus(`Success! Synced with Supabase. Loaded ${leases.length} lease records.`, true);
            } catch (err) {
                setSystemStatus('Database Sync Interrupted: ' + err.message, false);
            }
        }

        async function saveLease(e) {
            e.preventDefault();
            setSystemStatus("Writing lease profile details...", true);
            
            const id = document.getElementById('lease-id').value;
            const payload = {
                property: document.getElementById('property').value,
                tenant: document.getElementById('tenant').value,
                email: document.getElementById('email').value,
                telephone: document.getElementById('telephone').value,
                lease_start: document.getElementById('lease-start').value,
                lease_end: document.getElementById('lease-end').value
            };

            try {
                let error;
                if (id) {
                    ({ error } = await supabaseClient.from('leases').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('leases').insert([payload]));
                }

                if (error) throw error;

                resetForm();
                await fetchLeases();
            } catch (err) {
                setSystemStatus('Database Write Error: ' + err.message, false);
            }
        }

        window.editLease = function(id) {
            const lease = leaseRecordsCache.find(r => r.id === id);
            if (!lease) return;

            document.getElementById('form-title').innerText = "Edit Lease";
            document.getElementById('lease-id').value = lease.id;
            document.getElementById('property').value = lease.property || '';
            document.getElementById('tenant').value = lease.tenant || '';
            document.getElementById('email').value = lease.email || '';
            document.getElementById('telephone').value = lease.telephone || '';
            document.getElementById('lease-start').value = lease.lease_start || '';
            document.getElementById('lease-end').value = lease.lease_end || '';
            cancelBtn.classList.remove('hidden');
        };

        window.renewLease = async function(id) {
            const lease = leaseRecordsCache.find(r => r.id === id);
            if (!lease) return;

            try {
                setSystemStatus("Extending lease agreement timeline...", true);
                const currentEndDate = new Date(lease.lease_end);
                const nextStart = new Date(currentEndDate.getTime() + 86400000).toISOString().split('T')[0];
                currentEndDate.setFullYear(currentEndDate.getFullYear() + 1);
                const nextEnd = currentEndDate.toISOString().split('T')[0];

                const { error } = await supabaseClient
                    .from('leases')
                    .update({ lease_start: nextStart, lease_end: nextEnd })
                    .eq('id', id);

                if (error) throw error;
                await fetchLeases();
            } catch (err) {
                setSystemStatus('Renewal Action Failed: ' + err.message, false);
            }
        };

        window.deleteLease = async function(id) {
            if (confirm('Permanently delete this active lease?')) {
                try {
                    setSystemStatus("Deleting lease table listing...", true);
                    const { error } = await supabaseClient.from('leases').delete().eq('id', id);
                    if (error) throw error;
                    await fetchLeases();
                } catch (err) {
                    setSystemStatus('Deletion Action Interrupted: ' + err.message, false);
                }
            }
        };

        function resetForm() {
            document.getElementById('form-title').innerText = "Add New Lease";
            form.reset();
            document.getElementById('lease-id').value = '';
            cancelBtn.classList.add('hidden');
        }
    </script>
</body>
</html>
